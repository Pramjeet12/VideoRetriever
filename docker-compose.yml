version: "3.9"

services:
  videoretriever:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videoretriever
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      PORT: 5000
      FLASK_DEBUG: "false"
    volumes:
      - ./downloads:/app/downloads
      - ./vector_db:/app/vector_db
      - huggingface_cache:/app/.cache/huggingface
    restart: unless-stopped

volumes:
  huggingface_cache:
